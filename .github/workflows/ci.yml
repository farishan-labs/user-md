name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: gofmt
        working-directory: checker
        run: test -z "$(gofmt -l .)" || (gofmt -d . && exit 1)
      - name: vet
        working-directory: checker
        run: go vet ./...
      - name: test
        working-directory: checker
        run: go test ./...
      - name: build
        working-directory: checker
        run: go build ./...